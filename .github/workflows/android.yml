name: Android CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g

jobs:
  validate:
    name: Validate (compile, unit tests, lint)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The ubuntu runner image ships the Android SDK (ANDROID_HOME) and sdkmanager.
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@v5

      - name: Repository hygiene (no secrets, no analytics/ads/network SDK)
        run: ./scripts/check-hygiene.sh

      - name: Compile
        run: ./gradlew :app:compileDebugKotlin :app:compileDebugUnitTestKotlin

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Android lint
        run: ./gradlew :app:lintDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: SimpleTools-SensorLab-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7

  build-apk:
    name: Build debug APK
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The ubuntu runner image ships the Android SDK (ANDROID_HOME) and sdkmanager.
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v5

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Verify the APK exists
        id: apk
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -n 1 || true)
          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "::error::APK not found in app/build/outputs/apk/debug"
            exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/SimpleTools-SensorLab-debug.apk
          echo "path=dist/SimpleTools-SensorLab-debug.apk" >> "$GITHUB_OUTPUT"
          ls -l dist

      - name: Audit APK permissions (must be none)
        run: ./scripts/check-apk-permissions.sh "${{ steps.apk.outputs.path }}"

      - name: SHA-256
        run: |
          cd dist
          sha256sum SimpleTools-SensorLab-debug.apk | tee SimpleTools-SensorLab-debug.apk.sha256
          echo "### APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- Size: $(stat -c %s SimpleTools-SensorLab-debug.apk) bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256: \`$(cut -d' ' -f1 SimpleTools-SensorLab-debug.apk.sha256)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: SimpleTools-SensorLab-Android-APK
          path: |
            dist/SimpleTools-SensorLab-debug.apk
            dist/SimpleTools-SensorLab-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
